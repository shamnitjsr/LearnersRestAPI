trigger:
  - main

# Corresponds to disableConcurrentBuilds()
lockBehavior: sequential

# Corresponds to agent any / Windows bat runner setup
pool:
  vmImage: 'windows-latest'

variables:
  REPO_URL: 'https://github.com/shamnitjsr/LearnersRestAPI.git'
  BRANCH: 'main'

# Set build timeout (30 minutes)
timeoutInMinutes: 30

stages:
  - stage: Checkout_Build_Test
    displayName: 'API Automation Pipeline'
    jobs:
      - job: BuildAndTest
        displayName: 'Build and Run Tests'
        steps:
          # Stage: Checkout
          - checkout: self
            displayName: 'Checking out project'

          # Tool setup (Java & Maven)
          - task: JavaToolInstaller@0
            displayName: 'Set up JDK'
            inputs:
              versionSpec: '11' # Adjust version as needed
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: MavenAuthenticate@0
            displayName: 'Maven Authenticate'
            inputs:
              artifactsFeeds: ''

          # Stage: Build
          - task: CmdLine@2
            displayName: 'Build Maven project'
            inputs:
              script: |
                echo Building Maven project...
                java -version
                mvn -version
                mvn -B clean compile

          # Stage: Test
          - task: CmdLine@2
            displayName: 'Execute Rest Assured API automation tests'
            inputs:
              script: |
                echo Executing Rest Assured API automation tests...
                mvn -B clean test

          # Stage: Report (Publish Test Results)
          - task: PublishTestResults@2
            displayName: 'Publish API automation test results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/target/surefire-reports/*.xml'
              failTaskOnFailedTests: true

          # Stage: Report (Publish Artifacts)
          - task: PublishPipelineArtifact@1
            displayName: 'Archive Surefire Reports Artifacts'
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/**/target/surefire-reports'
              artifact: 'surefire-reports'
              publishLocation: 'pipeline'

          # Post actions
          - task: CmdLine@2
            displayName: 'Post Success'
            condition: succeeded()
            inputs:
              script: echo API automation execution completed successfully.

          # Note: 'failed()' requires explicit double quotes inside YAML script expressions
          - task: CmdLine@2
            displayName: 'Post Failure'
            condition: failed()
            inputs:
              script: echo API automation execution FAILED. Check the Test and Report stages.

          - task: CmdLine@2
            displayName: 'Post Always'
            condition: always()
            inputs:
              script: echo Jenkins API automation pipeline execution completed.