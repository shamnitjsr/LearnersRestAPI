trigger:
  branches:
    include:
      - main

# Equivalent of disableConcurrentBuilds(): queue new runs instead of running in parallel
lockBehavior: sequential

pool:
  vmImage: 'windows-latest'   # Jenkins used bat, so Windows

variables:
  REPO_URL: 'https://github.com/shamnitjsr/LearnersRestAPI.git'
  BRANCH: 'main'

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: BuildJob
        displayName: Build Maven project
        timeoutInMinutes: 30            # Jenkins timeout(30 MINUTES)
        steps:
          - checkout: self
            displayName: 'Checkout Rest Assured project'

          - task: JavaToolInstaller@0
            displayName: 'Set up JDK'
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - script: |
              java -version
              mvn -version
            displayName: 'Show Java and Maven versions'

          - script: mvn -B clean compile
            displayName: 'Build Maven project'

  - stage: Test
    displayName: Test
    dependsOn: Build
    jobs:
      - job: TestJob
        displayName: Run Rest Assured tests
        timeoutInMinutes: 30
        steps:
          - checkout: self

          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - script: mvn -B clean test
            displayName: 'Execute Rest Assured API tests'

          # Equivalent of junit(...)
          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/target/surefire-reports/*.xml'
              failTaskOnFailedTests: false
              failTaskOnMissingResultsFile: true   # Jenkins allowEmptyResults: false
              mergeTestResults: true

          # Equivalent of archiveArtifacts(...)
          - task: PublishPipelineArtifact@1
            displayName: 'Archive surefire reports'
            condition: always()
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)'
              artifact: 'surefire-reports'
              publishLocation: 'pipeline'
              # Only publish the reports folders
              # (see the simpler alternative below)